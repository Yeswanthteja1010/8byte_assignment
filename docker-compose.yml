services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: octabyte-app

    ports:
      - "8000:8000"

    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/octabyte

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine

    container_name: octabyte-postgres

    environment:
      POSTGRES_DB: octabyte
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octabyte"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


volumes:
  postgres_data: